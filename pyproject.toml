[project]
name = "transcribe-episode"
version = "0.1.0"
description = "Podcast transcription: VibeVoice-ASR (text+speakers) + Parakeet (word timestamps) on MLX"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mlx-audio==0.6.5",
  "parakeet-mlx==0.7.0",
  "numpy",
  "fastapi>=0.162.5",
  "uvicorn>=0.54.0",
  "python-multipart>=0.0.33",
  "sherpa-onnx>=1.12",
  "scipy>=1.17.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
